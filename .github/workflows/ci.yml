name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 — Typecheck
        run: npm run typecheck

      - name: Gate 2 — Lint
        run: npm run lint

      - name: Gate 3 — Unit tests
        run: npm run test:unit

      - name: Gate 4 — Integration tests
        run: npm run test:integration

      - name: Gate 5 — Build
        run: npm run build

      - name: Gate 6 — Bundle size (≤ 250 KB gzipped)
        run: |
          BUNDLE_SIZE=$(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c)
          echo "Gzipped JS bundle size: ${BUNDLE_SIZE} bytes"
          if [ "$BUNDLE_SIZE" -gt 256000 ]; then
            echo "FAIL: bundle exceeds 250 KB gzipped"
            exit 1
          fi

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
